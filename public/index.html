<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nhà Trọ Cần Thơ</title><link rel="icon" href="/assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/css/app.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="/js/common.js"></script><script defer src="/js/cards.js"></script><script defer src="/js/cantho-addresses.js"></script><script defer src="/js/listings.js"></script></head>
<body><div data-component="header"></div><main class="container"><section class="hero"><div class="eyebrow">Khám phá phòng trọ Cần Thơ</div><h1>Tìm trọ <span>Cần Thơ</span></h1><p class="hero-copy">Tìm phòng phù hợp gần trường học và các khu vực tại Cần Thơ.</p></section>
<section class="search-box advanced-filters">
<div class="field"><label for="q">Từ khóa</label><input id="q" placeholder="Tên phòng hoặc khu vực"></div>
<div class="field"><label for="budget">Giá thuê</label><select id="budget"><option value="">Mọi mức giá</option><option value="3">Dưới 3 triệu</option><option value="5">3–5 triệu</option><option value="8">5–8 triệu</option><option value="9">Trên 8 triệu</option></select></div>
<div class="field"><label for="kind">Loại phòng</label><select id="kind"><option value="">Tất cả</option></select></div>
<div class="school-filter"><label for="school">Gần trường nào?</label><div class="school-filter-controls"><select id="school"><option value="">Chọn trường</option></select><select id="schoolRadius" aria-label="Bán kính quanh trường"><option value="">Chọn bán kính</option><option value="1">1 km</option><option value="2">2 km</option><option value="3">3 km</option><option value="5">5 km</option><option value="10">10 km</option></select></div></div>
<details class="amenity-filter"><summary>Tiện nghi <small>(có thể chọn nhiều)</small></summary><div class="amenity-filter-options">
<label><input type="checkbox" name="amenity" value="Máy lạnh"> Máy lạnh</label><label><input type="checkbox" name="amenity" value="Máy giặt"> Máy giặt</label><label><input type="checkbox" name="amenity" value="Máy nước nóng"> Máy nước nóng</label><label><input type="checkbox" name="amenity" value="Tủ lạnh"> Tủ lạnh</label><label><input type="checkbox" name="amenity" value="Ban công"> Ban công</label><label><input type="checkbox" name="amenity" value="WC riêng"> WC riêng</label><label><input type="checkbox" name="amenity" value="Bếp riêng"> Bếp riêng</label><label><input type="checkbox" name="amenity" value="Thang máy"> Thang máy</label><label><input type="checkbox" name="amenity" value="Chỗ để xe"> Chỗ để xe</label><label><input type="checkbox" name="amenity" value="Cho nuôi thú cưng"> Cho nuôi thú cưng</label>
</div></details>
<details class="address-filters"><summary>Lọc theo địa chỉ</summary><div class="address-filter-grid">
<div class="field"><label for="province">Tỉnh / thành phố</label><select id="province"><option value="">Tất cả</option></select></div><div class="field"><label for="district">Khu vực / quận cũ</label><select id="district"><option value="">Tất cả</option></select></div><div class="field"><label for="ward">Phường / xã</label><select id="ward"><option value="">Tất cả</option></select></div><div class="field"><label for="street">Đường</label><select id="street"><option value="">Tất cả</option></select></div>
</div></details><button class="search-submit" id="searchBtn">Lọc phòng</button></section>
<button class="mobile-map-toggle" id="mobileMap">Xem bản đồ</button><section class="content"><div><div class="listing-head"><h2>Phòng cho thuê <span class="result-count" id="count"></span></h2><select class="sort" id="sort"><option value="recommended">Mới đăng</option><option value="price">Giá thấp đến cao</option></select></div><div class="cards" id="cards"></div></div><aside class="map-wrap" id="mapWrap"><div class="map-panel"><div id="map"></div><div class="map-top"><div class="map-pill">Bản đồ</div><div class="map-tools"><button class="map-tool" id="zoomIn" aria-label="Phóng to">+</button><button class="map-tool" id="zoomOut" aria-label="Thu nhỏ">−</button><button class="map-tool" id="resetMap" aria-label="Về Cần Thơ">⌖</button></div></div></div></aside></section></main><div data-component="footer"></div><div id="toast" class="toast"></div></body></html>
